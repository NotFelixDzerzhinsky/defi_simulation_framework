[package]
name = "dex-sim"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"

[lib]
name = "dex_sim"
path = "src/lib.rs"

[[bin]]
name = "dex-sim"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
toml = "0.8"
ureq = { version = "2.10", features = ["json"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
